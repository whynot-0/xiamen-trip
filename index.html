document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(refreshMap,80)});
function allPoints(day){return (day?.locations||[]).filter(x=>x.lat&&x.lng&&(day.id===8||(x.plan||'A')==='A'))}
function showMap(id){markers.forEach(x=>map.removeLayer(x));lines.forEach(x=>map.removeLayer(x));markers=[];lines=[];let pts=[],days=id===0?DAYS.filter(d=>d.id>=1&&d.id<=7):DAYS.filter(d=>d.id===id);days.forEach(day=>{let cs=[];allPoints(day).forEach((l,i)=>{let icon=L.divIcon({className:'pin',html:String(i+1),iconSize:[29,29],iconAnchor:[14,14]});let m=L.marker([l.lat,l.lng],{icon}).addTo(map).bindPopup('<b>'+esc(l.name)+'</b><br>'+esc(l.time)+'<br><a target="_blank" href="'+amap(l.name)+'">高德导航</a>');markers.push(m);pts.push([l.lat,l.lng]);cs.push([l.lat,l.lng])});if(id!==0&&cs.length>1)lines.push(L.polyline(cs,{color:day.color||'#176b73',weight:3,opacity:.65,dashArray:'6 7'}).addTo(map))});if(pts.length)map.fitBounds(pts,{padding:[35,35],maxZoom:id===0?11:14});document.getElementById('mapTitle').textContent=id===0?'全程地图':(DAYS.find(d=>d.id===id)?.label||'路线地图');setTimeout(()=>map.invalidateSize(),100)}
function shot(loc){let ps=(loc.photos||[]).slice(0,3);if(!ps.length)return'';let imgs=ps.map((p,i)=>'<a class="gallery-item g'+i+'" target="_blank" rel="noopener" href="'+esc(p.url||loc.xhs)+'"><img loading="lazy" src="'+esc(p.localSrc||p.src)+'" alt="'+esc(loc.name)+'实拍 '+(i+1)+'"></a>').join('');let p=ps[0];return '<div class="gallery" data-count="'+ps.length+'">'+imgs+'</div><div class="gallery-caption">'+esc(p.author)+' · '+esc(p.date)+'　<a target="_blank" href="'+esc(p.url||loc.xhs)+'">查看小红书原笔记</a></div>'}
function hotelImpact(l){let r=l.routeImpact;if(!r)return '';return '<section class="hotel-impact"><h3>换住后怎么安排</h3><p>'+esc(r.verdict)+'</p><dl>'+r.items.map(x=>'<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>').join('')+'</dl><small>通勤为规划估算，国庆按实时导航留余量；这里比较两晚都换住，不建议中间搬酒店。</small></section>'}
function card(l,id){let refs=(l.researchLinks||[]).map(r=>'<a target="_blank" href="'+esc(r.url)+'">'+esc(r.title)+'</a>').join(' · '),q=l.quote;return '<article class="stop"><div class="stop-time">'+esc(l.time)+'</div><div class="stop-body"><h2>'+esc(l.name)+'</h2><p>'+esc(l.desc)+'</p>'+(q?'<div class="budget">'+esc(q.room)+' · '+(typeof q.avg==='number'?'¥'+q.avg+'/晚':'房价以订单为准')+'</div>':l.budget?'<div class="budget">'+esc(l.budget)+'</div>':'')+(id===8?hotelImpact(l):'')+shot(l)+'<div class="actions"><a target="_blank" href="'+amap(l.name)+'">高德导航</a>'+(l.xhs?'<a target="_blank" href="'+esc(l.xhs)+'">小红书实拍</a>':'')+(l.reserve?'<a target="_blank" href="'+esc(l.reserve)+'">'+(q?'查房型':'预约/资料')+'</a>':'')+'</div>'+(l.detail||refs?'<details class="more"><summary>交通、机位与依据</summary><div>'+esc(l.detail||'').replace(/\n/g,'<br>')+(refs?'<br>'+refs:'')+'</div></details>':'')+'</div></article>'}
function overview(){let a=DATA.alerts?.[0],flow=DAYS.filter(d=>d.id>=1&&d.id<=7);return DATA.overview+'<section class="booking"><div><h2>'+esc(DATA.hotel.name)+'</h2><p>'+esc(DATA.hotel.transit)+'</p><p>'+esc(DATA.hotel.quote.near)+'</p></div><div><div class="price">房价以新订单为准</div><p>全季国际会展中心店 · 10月5日入住、7日退房 · 房型与取消规则请按订单核对</p></div></section>'+(a?'<aside class="notice"><strong>'+esc(a.title)+'</strong><p>'+esc(a.body)+'</p><div class="notice-links">'+a.links.map(x=>'<a target="_blank" href="'+esc(x.url)+'">'+esc(x.title)+'</a>').join('')+'</div></aside>':'')+'<div class="route-list">'+flow.map(d=>'<div class="route-row" data-go="'+d.id+'"><time>'+esc(d.label)+'</time><b>'+esc(d.title)+'</b><span>查看路线</span></div>').join('')+'</div>'}
function dayPage(d){return '<header class="day-head"><p class="kicker">'+esc(d.label)+'</p><h1>'+esc(d.title)+'</h1><p>'+esc(d.date)+'</p></header>'+['A','B','C','D'].map(p=>{let g=d.locations.filter(l=>(l.plan||'A')===p);return g.length?'<section class="plan '+p+'"><div class="plan-title"><b>Plan '+p+'</b><span>'+labels[p]+'</span></div>'+(p==='D'?'<p class="trip-meta">翔安校区入校须独立确认；左侧地图仅绘主线点位，翔安请点卡片内高德导航。</p>':'')+g.map(l=>card(l,d.id)).join('')+'</section>':''}).join('')}
function hotels(){let hs=DAYS.find(d=>d.id===8).locations;return '<header class="hotel-intro"><div><p class="kicker">当前酒店＋4家历史候选</p><h1>酒店比较</h1></div><p>正式行程按全季厦门国际会展中心店执行；其房费、房型和取消条款尚未录入。其余酒店为9月28日旧报价，仅作比较，不影响当前路线。</p></header><table class="hotel-table"><thead><tr><th>酒店 / 开业</th><th>交通</th><th>每晚</th></tr></thead><tbody>'+hs.map((h,i)=>'<tr class="hotel-row" data-hotel="'+i+'"><td><b>'+esc(h.name)+'</b><br><small>'+esc(h.year)+' · '+esc(h.zone)+' · '+esc(h.water)+'</small></td><td>'+esc(h.transit)+'</td><td class="money">'+(typeof h.quote.avg==='number'?'¥'+esc(h.quote.avg):'待核实')+'</td></tr>').join('')+'</tbody></table>'+hs.map((h,i)=>'<details class="hotel-details" '+(h.entity==='hotel-atour'?'open ':'')+'id="hotel-'+i+'"><summary><span>'+String(i+1).padStart(2,'0')+'　'+esc(h.name)+'</span><span>'+(typeof h.quote.avg==='number'?'¥'+esc(h.quote.avg):'待核实')+'</span></summary>'+card(h,8)+'</details>').join('')}
function go(id){current=+id;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',+x.dataset.id===current));document.getElementById('content').innerHTML=current===0?overview():current===8?hotels():dayPage(DAYS.find(d=>d.id===current));document.querySelector('.content').scrollTop=0;showMap(current);document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('[data-hotel]').forEach(x=>x.onclick=()=>{let e=document.getElementById('hotel-'+x.dataset.hotel);e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'})})}
document.getElementById('tabs').innerHTML=visibleIds.map(id=>{let d=DAYS.find(x=>x.id===id);return '<button class="tab" data-id="'+id+'">'+(id===0?'总览':id===8?'酒店':id===9?'美食':id===10?'影视机位':esc(d.label.replace('·',' ')))+'</button>'}).join('');document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>go(x.dataset.id));document.querySelector('.brand').onclick=e=>{e.preventDefault();go(0)};
document.getElementById('mapToggle').onclick=()=>{let p=document.getElementById('mapPanel'),b=document.getElementById('mapToggle');p.classList.toggle('collapsed');b.textContent=p.classList.contains('collapsed')?'展开地图':'收起地图';setTimeout(refreshMap,120)};go(0);
</script></body></html>
